[package]
name = "cloud_saves"
version = "0.1.0"
edition = "2024"

[dependencies]
async-trait = "0.1.89"
database = { version = "0.1.0", path = "../database" }
dirs = "6.0.0"
hex = "0.4.3"
log = "0.4.28"
regex = "1.11.3"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_with = "3.15.0"
sha2 = "0.10.9"
tar = "0.4.46"
tempfile = "3.23.0"
uuid = { version = "1.18.1", features = ["v4"] }
whoami = "1.6.1"
zstd = "0.13.3"

[target.'cfg(windows)'.dependencies]
known-folders = "1.2.0"

[dev-dependencies]
futures-lite = "2.6.0"
